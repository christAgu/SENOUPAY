<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senou Pay — Envoyer de l'argent</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <div class="app-frame">

    <div id="app-header"></div>
    <script>
      window.SENOU_HEADER_OPTIONS = { showBack: true };
    </script>

    <main class="screen-body send-money-body">
      <h1 class="send-money-title">Envoyer de l'argent</h1>
      <p class="send-money-subtitle">Testez la simulation d'envoi — aucune authentification n'est requise pour essayer.</p>

      <div class="send-money-form">
        <label class="field-label" for="send-money-amount-xof">Montant en XOF</label>
        <input id="send-money-amount-xof" class="input-field" type="number" min="0" inputmode="numeric" placeholder="0">

        <p class="field-label" style="margin-top: var(--space-4);">Équivalent en EUR</p>
        <p id="send-money-amount-eur" class="conversion-preview-text">0,00 €</p>

        <p class="rate-caption">Taux fixe : 1 € = 655.957 XOF</p>
        <button id="send-money-continue-btn" class="btn-primary btn-block" style="margin-top: var(--space-4);">Envoyer</button>
      </div>
    </main>

  </div>

  <script src="js/state.js"></script>
  <script src="js/pricing.js"></script>
  <script src="js/format.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/screens/send-money.js"></script>
</body>
</html>

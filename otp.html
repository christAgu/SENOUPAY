<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senou Pay — Vérification</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <div class="app-frame">

    <div id="app-header"></div>
    <script>
      window.SENOU_HEADER_OPTIONS = { showBack: true };
    </script>

    <main class="screen-body otp-body">
      <h1 class="otp-title">Vérification</h1>
      <p class="otp-subtitle">Entrez le code reçu par SMS.</p>

      <div class="otp-form">
        <label class="field-label" for="otp-code">Code de vérification</label>
        <input id="otp-code" class="input-field" type="text" inputmode="numeric" maxlength="6" placeholder="123456" autocomplete="one-time-code">

        <p id="otp-error" class="auth-error" hidden>Merci de saisir le code reçu.</p>
        <p id="otp-toast" class="toast-message" hidden>Un nouveau code a été envoyé.</p>

        <button id="otp-verify-btn" class="btn-primary btn-block" style="margin-top: var(--space-6);">Vérifier</button>
      </div>

      <p class="otp-resend">
        <a href="#" id="otp-resend-link">Renvoyer le code</a>
      </p>
    </main>

  </div>

  <script src="js/state.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/screens/otp.js"></script>
</body>
</html>

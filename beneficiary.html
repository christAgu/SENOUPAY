<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senou Pay — Bénéficiaire</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <div class="app-frame">

    <div id="app-header"></div>
    <script>
      window.SENOU_HEADER_OPTIONS = { showBack: true };
    </script>

    <main class="screen-body beneficiary-body">
      <div id="amount-banner" class="amount-banner"></div>

      <h1 class="beneficiary-title">Bénéficiaire</h1>

      <form id="beneficiary-form" class="beneficiary-form" novalidate>
        <div class="form-section">
          <p class="form-section-title">Informations du bénéficiaire</p>

          <label class="field-label" for="beneficiary-name">Nom complet du bénéficiaire</label>
          <input id="beneficiary-name" class="input-field" type="text" required>

          <label class="field-label" for="beneficiary-iban">IBAN du bénéficiaire</label>
          <input id="beneficiary-iban" class="input-field" type="text" placeholder="FR76 XXXX XXXX XXXX XXXX XXXX XXX" required>

          <label class="field-label" for="beneficiary-bic">BIC / SWIFT</label>
          <input id="beneficiary-bic" class="input-field" type="text" placeholder="XXXXFRPPXXX" required>

          <label class="field-label" for="beneficiary-address">Adresse</label>
          <input id="beneficiary-address" class="input-field" type="text" required>

          <label class="field-label" for="beneficiary-city">Ville</label>
          <input id="beneficiary-city" class="input-field" type="text" required>

          <label class="field-label" for="beneficiary-postal">Code postal</label>
          <input id="beneficiary-postal" class="input-field" type="text" required>

          <label class="field-label" for="beneficiary-country">Pays</label>
          <select id="beneficiary-country" class="input-field" required>
            <option value="France" selected>France</option>
            <option value="Belgique">Belgique</option>
            <option value="Royaume-Uni">Royaume-Uni</option>
            <option value="Malte">Malte</option>
            <option value="Pays-Bas">Pays-Bas</option>
          </select>

          <label class="field-label" for="beneficiary-phone">Téléphone du bénéficiaire (optionnel)</label>
          <input id="beneficiary-phone" class="input-field" type="tel">
        </div>

        <div class="form-section">
          <label class="field-label" for="beneficiary-relation">Relation avec le bénéficiaire</label>
          <select id="beneficiary-relation" class="input-field" required>
            <option value="">Sélectionner…</option>
            <option value="self">Moi-même (mon propre compte)</option>
            <option value="family">Famille</option>
            <option value="friend">Ami(e)</option>
            <option value="other">Autre</option>
          </select>

          <label class="field-label" for="beneficiary-purpose">Motif du transfert</label>
          <select id="beneficiary-purpose" class="input-field" required>
            <option value="">Sélectionner…</option>
            <option value="family_support">Soutien familial</option>
            <option value="bills">Paiement de factures</option>
            <option value="education">Frais de scolarité</option>
            <option value="savings">Épargne personnelle</option>
            <option value="other">Autre</option>
          </select>
        </div>

        <div class="form-section">
          <p class="form-section-title">Mode d'ajout des XOF</p>
          <div class="radio-group" id="operator-group">
            <label class="radio-option" data-operator="MTN Mobile Money">
              <input type="radio" name="operator" value="MTN Mobile Money">
              <div class="operator-info">
                <img src="assets/images/mtn-momo.png" alt="MTN Mobile Money" class="operator-logo">
                <span class="operator-name">MTN Mobile Money</span>
              </div>
              <div class="radio-indicator"></div>
            </label>
            <label class="radio-option" data-operator="Moov Money">
              <input type="radio" name="operator" value="Moov Money">
              <div class="operator-info">
                <img src="assets/images/moov-money.png" alt="Moov Money" class="operator-logo">
                <span class="operator-name">Moov Money</span>
              </div>
              <div class="radio-indicator"></div>
            </label>
            <label class="radio-option" data-operator="Celtiis Cash">
              <input type="radio" name="operator" value="Celtiis Cash">
              <div class="operator-info">
                <img src="assets/images/celtiis-cash.png" alt="Celtiis Cash" class="operator-logo">
                <span class="operator-name">Celtiis Cash</span>
              </div>
              <div class="radio-indicator"></div>
            </label>
          </div>

          <div id="mobile-money-field" class="mobile-money-field" hidden>
            <label class="field-label" for="mobile-money-number">Numéro Mobile Money</label>
            <input id="mobile-money-number" class="input-field" type="tel" placeholder="ex. 90 00 00 00">
          </div>
        </div>

        <button id="beneficiary-submit-btn" type="submit" class="btn-primary btn-block" style="margin-top: var(--space-6);" disabled>Confirmer l'envoi</button>
      </form>
    </main>

  </div>

  <script src="js/state.js"></script>
  <script src="js/format.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/screens/beneficiary.js"></script>
</body>
</html>
